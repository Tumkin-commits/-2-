<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>特定技能2号 製造業 練習問題</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDEEEB;
    --panel:#FFFFFF;
    --ink:#1E2A32;
    --ink-soft:#5C6670;
    --line:#D4D6D2;
    --amber:#D98E2B;
    --amber-deep:#B5751E;
    --red:#B23A2E;
    --green:#3F7D5C;
    --navy:#1E2A32;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans JP',system-ui,sans-serif;}
  h1,h2,h3,.num,.counter,.tile-num{font-family:'Barlow Semi Condensed','Noto Sans JP',sans-serif;}
  .app{max-width:760px;margin:0 auto;padding:0 0 60px;}

  .headbar{background:var(--navy);color:#fff;padding:22px 20px 20px;}
  .headbar .eyebrow{font-size:13px;color:#B9C2C8;letter-spacing:.02em;margin:0 0 4px;}
  .headbar h1{margin:0;font-size:24px;font-weight:700;line-height:1.25;}
  .headbar .sub{margin-top:6px;font-size:14px;color:#B9C2C8;}
  .headbar .adminrow{margin-top:10px;font-size:12px;color:#8EA0AA;display:flex;align-items:center;gap:8px;}
  .pill{background:#28363F;padding:3px 9px;border-radius:20px;font-size:11px;color:#DCE3E6;}

  .content{padding:22px 20px;}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:6px;}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 14px;cursor:pointer;text-align:left;position:relative;transition:border-color .15s;}
  .tile:hover{border-color:var(--amber-deep);}
  .tile-num{font-size:34px;font-weight:700;line-height:1;color:var(--navy);}
  .tile-label{font-size:13px;color:var(--ink-soft);margin-top:2px;}
  .tile-status{margin-top:10px;font-size:12px;padding:3px 8px;border-radius:3px;display:inline-block;font-weight:500;}
  .status-new{background:#E8E9E6;color:var(--ink-soft);}
  .status-done{background:#E4EEE8;color:var(--green);}

  .toolbar{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
  button{font-family:'Noto Sans JP',sans-serif;cursor:pointer;}
  .btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 14px;border-radius:5px;font-size:14px;font-weight:500;}
  .btn:hover{border-color:var(--navy);}
  .btn-primary{background:var(--navy);color:#fff;border-color:var(--navy);}
  .btn-primary:hover{background:#28363F;}
  .btn-amber{background:var(--amber);color:#fff;border-color:var(--amber);}
  .btn-amber:hover{background:var(--amber-deep);}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--ink-soft);}
  .btn-ghost:hover{color:var(--ink);}
  .btn[disabled]{opacity:.4;cursor:not-allowed;}

  .quiz-top{display:flex;justify-content:space-between;align-items:center;background:var(--navy);color:#fff;padding:14px 20px;}
  .counter{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;}
  .counter .of{color:#8EA0AA;font-weight:500;}
  .progress-track{height:4px;background:#33424B;}
  .progress-fill{height:100%;background:var(--amber);transition:width .2s;}

  .qcard{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:22px 20px;margin-top:18px;}
  .qtext{font-size:17px;line-height:1.7;margin:0 0 18px;}
  .opt{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:5px;padding:12px 14px;margin-bottom:10px;cursor:pointer;background:#fff;}
  .opt:hover{border-color:var(--amber-deep);}
  .opt.selected{border-color:var(--amber);background:#FBF2E4;}
  .opt.correct{border-color:var(--green);background:#E4EEE8;}
  .opt.wrong{border-color:var(--red);background:#F5E4E2;}
  .opt-num{width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .opt.selected .opt-num{background:var(--amber-deep);}
  .opt.correct .opt-num{background:var(--green);}
  .opt.wrong .opt-num{background:var(--red);}
  .opt-text{font-size:15px;line-height:1.6;}

  .explain{margin-top:14px;padding:12px 14px;background:#F4F5F3;border-left:3px solid var(--amber);border-radius:3px;font-size:14px;color:var(--ink-soft);display:none;line-height:1.7;}
  .explain.show{display:block;}

  .qnav{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px;}
  .flag-btn{font-size:13px;padding:8px 12px;}
  .flag-btn.flagged{background:#FBF2E4;border-color:var(--amber);color:var(--amber-deep);}

  .jumpgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:16px;}
  .jbtn{aspect-ratio:1;border-radius:4px;border:1px solid var(--line);background:#fff;font-size:12px;font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;color:var(--ink-soft);}
  .jbtn.answered{background:var(--navy);color:#fff;border-color:var(--navy);}
  .jbtn.flagged{border-color:var(--amber);box-shadow:inset 0 0 0 2px var(--amber);}
  .jbtn.current{outline:2px solid var(--amber-deep);outline-offset:1px;}
  .jbtn.unanswered{border-color:var(--amber);color:var(--amber-deep);font-weight:700;}

  /* Sidebar navigasi soal */
  .quiz-top .icon-btn{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;padding:4px 6px;line-height:1;}
  .sidebar-overlay{position:fixed;inset:0;background:rgba(30,42,50,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;}
  .sidebar-overlay.open{opacity:1;pointer-events:auto;}
  .sidebar-panel{position:fixed;top:0;right:0;bottom:0;width:82%;max-width:340px;background:#fff;z-index:41;
    box-shadow:-4px 0 16px rgba(0,0,0,.15);transform:translateX(100%);transition:transform .22s ease;
    display:flex;flex-direction:column;}
  .sidebar-panel.open{transform:translateX(0);}
  .sidebar-head{background:var(--navy);color:#fff;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;}
  .sidebar-head h3{margin:0;font-size:16px;font-family:'Barlow Semi Condensed',sans-serif;}
  .sidebar-body{padding:16px 18px;overflow-y:auto;flex:1;}
  .sidebar-summary{font-size:13px;color:var(--ink-soft);margin-bottom:12px;}
  .sidebar-summary b{color:var(--amber-deep);}
  .sidebar-legend{display:flex;gap:14px;font-size:11px;color:var(--ink-soft);margin-bottom:14px;flex-wrap:wrap;}
  .sidebar-legend span{display:inline-flex;align-items:center;gap:4px;}
  .legend-dot{width:10px;height:10px;border-radius:3px;display:inline-block;}
  .sidebar-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;}
  .sidebar-grid .jbtn{aspect-ratio:1;font-size:12px;}

  .score-hero{text-align:center;padding:34px 20px;}
  .score-num{font-size:64px;font-weight:700;line-height:1;color:var(--navy);}
  .score-den{font-size:20px;color:var(--ink-soft);}
  .score-tag{margin-top:8px;font-size:14px;color:var(--ink-soft);}

  .review-item{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;margin-top:10px;}
  .review-q{font-size:14px;font-weight:600;margin:0 0 8px;line-height:1.6;}
  .review-tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:3px;margin-left:6px;}
  .tag-correct{background:#E4EEE8;color:var(--green);}
  .tag-wrong{background:#F5E4E2;color:var(--red);}

  .field{margin-bottom:12px;}
  .field label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:4px;font-weight:500;}
  .field input[type=text], .field input[type=email], .field input[type=password], .field textarea, .field select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:5px;font-family:'Noto Sans JP',sans-serif;font-size:14px;}
  .field textarea{resize:vertical;min-height:44px;}
  .qlist-item{display:flex;justify-content:space-between;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line);font-size:14px;}
  .qlist-item:last-child{border-bottom:none;}
  .small-actions button{font-size:12px;padding:4px 8px;margin-left:4px;}
  textarea.jsonbox{width:100%;min-height:180px;font-family:monospace;font-size:12px;}
  .hint{font-size:12px;color:var(--ink-soft);margin-top:4px;line-height:1.6;}
  .backlink{font-size:13px;color:var(--ink-soft);cursor:pointer;display:inline-block;margin-bottom:14px;}
  .backlink:hover{color:var(--ink);}
  .section-title{font-size:15px;font-weight:600;margin:22px 0 8px;color:var(--navy);}
  hr.sep{border:none;border-top:1px solid var(--line);margin:22px 0;}
  .banner{background:#FBF2E4;border:1px solid var(--amber);color:var(--amber-deep);padding:10px 14px;border-radius:5px;font-size:13px;margin-bottom:16px;line-height:1.6;}
  .banner-error{background:#F5E4E2;border-color:var(--red);color:var(--red);}
  .loginbox{max-width:340px;margin:60px auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:26px;}
  .center-loading{text-align:center;padding:80px 20px;color:var(--ink-soft);font-size:14px;}
</style>
</head>

function defaultBank(){
  return JSON.parse(JSON.stringify(REAL_BANK));
}

/* ======================= STATE ======================= */
let bank = null;          // Firestoreから読み込んだデータ(nullなら未読込)
let bankLoading = true;
let bankError = null;
let currentUser = null;   // Firebase Authのユーザー(管理者)
let history = loadHistory();
let view = "home";
let quizState = null;
let editingSessionId = null;
let editingQIndex = null;
let loginError = "";

const app = document.getElementById("app");

/* ======================= FIRESTORE I/O ======================= */
async function fetchBank(){
  bankLoading = true; bankError = null; render();
  try{
    const snap = await getDoc(BANK_DOC);
    bank = snap.exists() ? snap.data() : null;
  }catch(e){
    bankError = e.message;
  }
  bankLoading = false;
  render();
}
async function saveBankToCloud(newBank){
  await setDoc(BANK_DOC, newBank);
  bank = newBank;
}

onAuthStateChanged(auth, (user)=>{
  currentUser = user;
  render();
});
fetchBank();

/* ======================= RENDER ROUTER ======================= */
function render(){
  if(bankLoading){
    app.innerHTML = `<div class="center-loading">読み込み中…</div>`;
    return;
  }
  if(view === "home") return renderHome();
  if(view === "adminLogin") return renderAdminLogin();
  if(view === "quiz") return renderQuiz();
  if(view === "result") return renderResult();
  if(view === "editor") return renderEditorHome();
  if(view === "editSession") return renderEditSession();
}

function adminBadge(){
  if(!currentUser) return "";
  return `<div class="adminrow"><span class="pill">管理者: ${escapeHtml(currentUser.email)}</span> <span class="backlink" id="btn-logout" style="margin:0;">ログアウト</span></div>`;
}
function bindLogoutIfPresent(){
  const el = document.getElementById("btn-logout");
  if(el) el.addEventListener("click", async ()=>{ await signOut(auth); view="home"; render(); });
}

/* ======================= HOME ======================= */

      <div class="content">
        <div class="banner banner-error">${escapeHtml(bankError)}<br>Firestoreのセキュリティルールと接続をご確認ください。</div>
        <button class="btn" id="btn-retry">再読み込み</button>
      </div>`;
    document.getElementById("btn-retry").addEventListener("click", fetchBank);
    return;
  }

  if(!bank){
    app.innerHTML = `
      <div class="headbar">
        <p class="eyebrow">特定技能2号・製造業分野</p>
        <h1>選択式練習問題</h1>

        <div class="banner">まだ問題データが作成されていません。管理者としてログインし、初期データを作成してください。</div>
        <div class="toolbar">
          ${currentUser
            ? `<button class="btn btn-amber" id="btn-seed">初期データ(8分野・100問)を作成</button>`

        </div>

    bindLogoutIfPresent();

    return;
  }

  let tiles = "";
  bank.sessions.forEach(s=>{
    const h = history[s.id];
    const statusHtml = h
      ? `<span class="tile-status status-done">スコア: ${h.score}/${h.total}</span>`

      </button>`;

    <div class="headbar">

      <h1>選択式練習問題</h1>
      <p class="sub">全8分野・計100問(4択)</p>
    </div>
    <div class="content">
      <div class="grid">${tiles}</div>

          ? `<button class="btn btn-amber" id="btn-editor">問題バンク管理</button>`

        <button class="btn" id="btn-reset-history">受験履歴をリセット</button>

/* ======================= QUIZ ======================= */
function startSession(sessionId){
  const session = bank.sessions.find(s=>s.id===sessionId);
  quizState = {
    sessionId,
    answers: new Array(session.questions.length).fill(null),
    flagged: new Set(),
    current: 0,
    checked: new Array(session.questions.length).fill(false),
    sidebarOpen: false
  };
  view = "quiz";
  render();
}

function renderQuiz(){
  const session = bank.sessions.find(s=>s.id===quizState.sessionId);
  const qi = quizState.current;
  const q = session.questions[qi];
  const total = session.questions.length;
  const selected = quizState.answers[qi];
  const isChecked = quizState.checked[qi];

  let optsHtml = "";
  q.options.forEach((opt, idx)=>{
    let cls = "opt";
    if(isChecked){
      if(idx === q.answer) cls += " correct";
      else if(idx === selected) cls += " wrong";
    } else if(selected === idx){
      cls += " selected";
    }
    optsHtml += `
      <div class="${cls}" data-choice="${idx}">
        <div class="opt-num">${idx+1}</div>
        <div class="opt-text">${escapeHtml(opt)}</div>
      </div>`;
  });

  let jump = "";
  session.questions.forEach((_,idx)=>{
    let cls = "jbtn";
    if(quizState.answers[idx] !== null) cls += " answered";
    else cls += " unanswered";
    if(quizState.flagged.has(idx)) cls += " flagged";
    if(idx === qi) cls += " current";
    jump += `<button class="${cls}" data-jump="${idx}">${idx+1}</button>`;
  });

  const unansweredCount = quizState.answers.filter(a=>a===null).length;
  const allAnswered = quizState.answers.every(a=>a!==null);
  const sidebarOpen = !!quizState.sidebarOpen;

  app.innerHTML = `
    <div class="quiz-top">
      <div style="display:flex;align-items:center;gap:14px;">
        <div>${session.title}</div>
        <div class="counter">${String(qi+1).padStart(2,"0")} <span class="of">/ ${total}</span></div>
      </div>
      <button class="icon-btn" id="btn-open-sidebar" aria-label="回答状況を見る">☰</button>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${((qi+1)/total)*100}%"></div></div>
    <div class="content">
      <div class="qcard">
        <p class="qtext">${escapeHtml(q.question)}</p>
        <div class="opts">${optsHtml}</div>
        <div class="explain ${isChecked ? "show":""}">${escapeHtml(q.explanation||"")}</div>
      </div>
      <div class="qnav">
        <button class="btn flag-btn ${quizState.flagged.has(qi)?"flagged":""}" id="btn-flag">${quizState.flagged.has(qi)?"★ フラグ済み":"☆ あとで見直す"}</button>
        <div style="display:flex;gap:8px;">
          <button class="btn" id="btn-prev" ${qi===0?"disabled":""}>前の問題</button>
          ${qi < total-1
            ? `<button class="btn btn-primary" id="btn-next">次の問題</button>`
            : `<button class="btn btn-amber" id="btn-finish" ${allAnswered?"":"disabled"}>終了してスコアを見る</button>`}
        </div>
      </div>
      <div style="margin-top:14px;">
        <button class="btn btn-ghost" id="btn-quit">ホームに戻る</button>
      </div>
    </div>

    <div class="sidebar-overlay ${sidebarOpen?"open":""}" id="sidebar-overlay"></div>
    <div class="sidebar-panel ${sidebarOpen?"open":""}" id="sidebar-panel">
      <div class="sidebar-head">
        <h3>回答状況</h3>
        <span class="backlink" id="btn-close-sidebar" style="color:#fff;margin:0;">✕ 閉じる</span>
      </div>
      <div class="sidebar-body">
        <div class="sidebar-summary">未回答: <b>${unansweredCount}問</b> ／ 全${total}問中</div>
        <div class="sidebar-legend">
          <span><span class="legend-dot" style="background:var(--navy);"></span>回答済み</span>
          <span><span class="legend-dot" style="background:#fff;border:2px solid var(--amber);"></span>未回答</span>
          <span><span class="legend-dot" style="background:#fff;border:2px solid var(--amber);box-shadow:inset 0 0 0 2px var(--amber);"></span>フラグ</span>
        </div>
        <div class="sidebar-grid">${jump}</div>
      </div>
    </div>
  `;

  app.querySelectorAll("[data-choice]").forEach(el=>{
    el.addEventListener("click", ()=>{
      if(quizState.checked[qi]) return;
      quizState.answers[qi] = parseInt(el.dataset.choice);
      quizState.checked[qi] = true;
      render();
    });
  });
  app.querySelectorAll("[data-jump]").forEach(el=>{
    el.addEventListener("click", ()=>{
      quizState.current = parseInt(el.dataset.jump);
      quizState.sidebarOpen = false;
      render();
    });
  });
  const openSidebarBtn = document.getElementById("btn-open-sidebar");
  if(openSidebarBtn) openSidebarBtn.addEventListener("click", ()=>{ quizState.sidebarOpen = true; render(); });
  const closeSidebarBtn = document.getElementById("btn-close-sidebar");
  if(closeSidebarBtn) closeSidebarBtn.addEventListener("click", ()=>{ quizState.sidebarOpen = false; render(); });
  const overlayEl = document.getElementById("sidebar-overlay");
  if(overlayEl) overlayEl.addEventListener("click", ()=>{ quizState.sidebarOpen = false; render(); });
  const flagBtn = document.getElementById("btn-flag");
  if(flagBtn) flagBtn.addEventListener("click", ()=>{
    if(quizState.flagged.has(qi)) quizState.flagged.delete(qi);
    else quizState.flagged.add(qi);
    render();
  });
  const prevBtn = document.getElementById("btn-prev");
  if(prevBtn) prevBtn.addEventListener("click", ()=>{ quizState.current--; render(); });
  const nextBtn = document.getElementById("btn-next");
  if(nextBtn) nextBtn.addEventListener("click", ()=>{ quizState.current++; render(); });
  const finishBtn = document.getElementById("btn-finish");
  if(finishBtn) finishBtn.addEventListener("click", finishQuiz);
  document.getElementById("btn-quit").addEventListener("click", ()=>{
    if(confirm("終了しますか?この回の進捗は保存されません。")){ view="home"; render(); }
  });
}

function finishQuiz(){
  const session = bank.sessions.find(s=>s.id===quizState.sessionId);
  let score = 0;
  session.questions.forEach((q,idx)=>{ if(quizState.answers[idx]===q.answer) score++; });
  history[quizState.sessionId] = { score, total: session.questions.length, date: new Date().toISOString() };
  saveHistory(history);
  view = "result";
  render();
}

/* ======================= RESULT ======================= */
function renderResult(){
  const session = bank.sessions.find(s=>s.id===quizState.sessionId);
  const total = session.questions.length;
  const h = history[quizState.sessionId];

  let reviewHtml = "";

    reviewHtml += `
      <div class="review-item">
        <p class="review-q">${idx+1}. ${escapeHtml(q.question)}
          <span class="review-tag ${correct?"tag-correct":"tag-wrong"}">${correct?"正解":"不正解"}</span>

        <div class="hint">あなたの回答: ${ans!==null ? (ans+1)+". "+escapeHtml(q.options[ans]) : "(未回答)"}</div>

        ${q.explanation ? `<div class="explain show">${escapeHtml(q.explanation)}</div>` : ""}
      </div>`;
  });

  app.innerHTML = `
    <div class="headbar">
      <p class="eyebrow">${session.title} ・ 終了</p>
      <h1>結果発表</h1>
    </div>
    <div class="content">
      <div class="score-hero">
        <div class="score-num">${h.score}<span class="score-den">/${total}</span></div>
        <div class="score-tag">正答率 ${Math.round((h.score/total)*100)}%</div>
      </div>
      <div class="toolbar" style="justify-content:center;">
        <button class="btn btn-primary" id="btn-retry">もう一度挑戦する</button>
        <button class="btn" id="btn-home">ホームに戻る</button>
      </div>
      <div class="section-title">解説</div>
      ${reviewHtml}
    </div>
  `;

  document.getElementById("btn-retry").addEventListener("click", ()=> startSession(session.id));
  document.getElementById("btn-home").addEventListener("click", ()=>{ view="home"; render(); });
}

    </div>
    <div class="content">
      <span class="backlink" id="back-editor">← 回の一覧に戻る</span>
      <div class="field">
        <label>問題文</label>
        <textarea id="f-question">${escapeHtml(q.question)}</textarea>
      </div>
      ${q.options.map((opt,idx)=>`
        <div class="field">
          <label>選択肢${idx+1} ${idx===q.answer? "(正解)":""}</label>
          <input type="text" class="f-opt" data-idx="${idx}" value="${escapeHtml(opt)}">
        </div>`).join("")}
      <div class="field">
        <label>正解</label>
        <select id="f-answer">
          ${[0,1,2,3].map(i=>`<option value="${i}" ${i===q.answer?"selected":""}>選択肢${i+1}</option>`).join("")}
        </select>
      </div>
      <div class="field">
        <label>解説(任意)</label>
        <textarea id="f-explain">${escapeHtml(q.explanation||"")}</textarea>
      </div>
      <div class="toolbar">
        <button class="btn btn-primary" id="btn-save-q">この問題をクラウドに保存</button>
        <button class="btn" id="btn-prev-q" ${qi===0?"disabled":""}>← 前の問題</button>
        <button class="btn" id="btn-next-q" ${qi===session.questions.length-1?"disabled":""}>次の問題 →</button>
      </div>
      <hr class="sep">
      <div class="section-title">${session.title}の問題一覧</div>
      ${list}
    </div>
  `;

  document.getElementById("back-editor").addEventListener("click", ()=>{ view="editor"; render(); });
  bindLogoutIfPresent();
  document.getElementById("btn-save-q").addEventListener("click", async ()=>{
    const btn = document.getElementById("btn-save-q");
    q.question = document.getElementById("f-question").value;
    q.explanation = document.getElementById("f-explain").value;
    q.answer = parseInt(document.getElementById("f-answer").value);
    app.querySelectorAll(".f-opt").forEach(inp=>{
      q.options[parseInt(inp.dataset.idx)] = inp.value;
    });
    btn.disabled = true; btn.textContent = "保存中…";
    try{
      await saveBankToCloud(bank);
      render();
    }catch(e){
      alert("保存に失敗しました: " + e.message);
      btn.disabled = false; btn.textContent = "この問題をクラウドに保存";
    }
  });
  document.getElementById("btn-prev-q").addEventListener("click", ()=>{ editingQIndex--; render(); });
  document.getElementById("btn-next-q").addEventListener("click", ()=>{ editingQIndex++; render(); });
  app.querySelectorAll("[data-goto]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ editingQIndex = parseInt(btn.dataset.goto); render(); });
  });
}

/* ======================= UTIL ======================= */
function escapeHtml(str){
  return String(str)
    .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}
</script>
</body>
</html>
